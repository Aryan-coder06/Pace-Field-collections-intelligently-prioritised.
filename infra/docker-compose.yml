services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pace
      POSTGRES_USER: pace
      POSTGRES_PASSWORD: pace
    ports: ["5432:5432"]
    volumes: ["pace_pg:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pace -d pace"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  pace_pg:
