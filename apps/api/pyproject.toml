[project]
name = "pace-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "sqlalchemy>=2.0", "alembic>=1.14", "psycopg[binary]>=3.2", "pwdlib[argon2]>=0.2", "pyjwt>=2.9", "email-validator>=2.2", "python-dotenv>=1.2", "python-multipart>=0.0.20"]
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
include = ["app*"]
[dependency-groups]
dev = ["pytest>=8.3", "httpx>=0.27", "ruff>=0.7"]
[tool.pytest.ini_options]
pythonpath = ["."]
[tool.ruff]
line-length = 100
[tool.ruff.lint]
ignore = ["B008"]
